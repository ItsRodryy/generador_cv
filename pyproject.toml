[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "generador-cv"
version = "2.0.0"
description = "Generador local de CV con una plantilla minimalista, guiado por Codex o Claude Code"
requires-python = ">=3.10"
dependencies = ["python-docx>=1.1,<2", "PyMuPDF>=1.24,<2", "Pillow>=10,<13"]

[project.scripts]
cv = "generador_cv.cli:main"

[tool.setuptools]
packages = ["generador_cv"]
